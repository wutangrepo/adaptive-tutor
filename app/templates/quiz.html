<!doctype html>
<html><head><meta charset="utf-8"><title>Adaptive Tutor</title></head>
<body style="max-width:640px;margin:2rem auto;font-family:sans-serif">
  <h2>Question {{ idx + 1 }} / {{ total }}</h2>
  <p><small>[{{ item.type }}] {{ item.source }}</small></p>
  <p>{{ item.stem }}</p>
  <details open><summary>Why this question?</summary><p>{{ why }}</p></details>
  <form method="post" action="/answer/{{ item.id }}?sid={{ sid }}">
    {% if item.type == 'mcq' %}
      {% for opt in item.payload.options %}
        <label style="display:block;margin:.25rem 0">
          <input type="radio" name="student_answer" value="{{ loop.index0 }}"> {{ opt }}
        </label>
      {% endfor %}
    {% else %}
      <input name="student_answer" autofocus autocomplete="off" placeholder="your answer">
    {% endif %}
    <br><br><button type="submit">Submit</button>
  </form>
</body></html>
