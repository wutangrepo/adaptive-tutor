<!doctype html>
<html><head><meta charset="utf-8"><title>Result</title></head>
<body style="max-width:640px;margin:2rem auto;font-family:sans-serif">
  {% if error %}
    <h2>⚠️ Couldn't read your answer</h2><p>{{ error }}</p>
  {% elif correct %}
    <h2>✅ Correct</h2>
  {% else %}
    <h2>❌ Not quite</h2><p>Expected: <b>{{ expected }}</b></p>
  {% endif %}
  <p><small>{{ item.stem }}</small></p>

  <details style="margin:.8rem 0">
    <summary>🤖 Want an AI second opinion on your reasoning?</summary>
    <p>Your answer: <b>{{ student_answer }}</b></p>
    <form method="post" action="/assess/{{ item.id }}">
      <input type="hidden" name="sid" value="{{ sid }}">
      <input type="hidden" name="picked_answer" value="{{ student_answer }}">
      <textarea name="answer_text" rows="3" style="width:100%"
                placeholder="explain how you arrived at your answer…"></textarea>
      <br><button type="submit">Ask AI to draft a grade (goes to professor review)</button>
    </form>
  </details>

  <a href="/?sid={{ sid }}">Next question →</a>
</body></html>
